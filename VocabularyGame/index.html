<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CVN Word World · K1–P6 Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-badge">🌈</div>
      <div>
        <div class="logo-name">CVN Word World</div>
        <div class="logo-sub">K1 – P6 Vocabulary</div>
      </div>
    </div>
    <div class="header-right">
      <div class="subline">
        <span class="chip">🔥 <b id="streakChip">0</b></span>
        <span class="chip">⭐ <b id="starChip">0</b></span>
        <span class="chip">🏅 <b id="badgeChip">0</b></span>
      </div>
      <div class="topnav">
        <button class="nav-btn" id="navHome" aria-label="Home">🏠</button>
        <button class="nav-btn" id="navDash" aria-label="My Progress">📊</button>
      </div>
    </div>
  </header>

  <!-- HOME -->
  <div id="home">

    <!-- HERO BANNER -->
    <div class="hero" id="heroBanner">
      <div class="hero-text">
        <div class="hero-greeting" id="heroGreeting">Good morning! 👋</div>
        <div class="hero-title">Ready to learn<br>new words today?</div>
        <div class="hero-stats">
          <div class="hstat"><b id="heroWords">0</b>words learnt</div>
          <div class="hstat"><b id="heroStreak">0</b>day streak</div>
          <div class="hstat"><b id="heroAcc">–</b>accuracy</div>
        </div>
      </div>
      <div class="hero-char">🦸</div>
    </div>

    <!-- LEVEL SELECT -->
    <div class="section-label">
      <i class="ti ti-school" style="font-size:16px" aria-hidden="true"></i>
      Choose your level
    </div>
    <div class="levels" id="levels" role="tablist" aria-label="Choose level"></div>

    <!-- SUBJECT FILTER (P1 only) -->
    <div class="subjectbar" id="subjectBar" style="display:none">
      <span class="subjectlabel">📚 Subject:</span>
      <div class="subjectpills" id="subjectPills" role="tablist" aria-label="Filter by subject"></div>
    </div>

    <!-- GAME MODES -->
    <div class="section-label">
      <i class="ti ti-gamepad" style="font-size:16px" aria-hidden="true"></i>
      Pick a game
    </div>
    <div class="menu" id="menu">
      <button class="card c1" data-game="quiz">
        <div class="ico-wrap"><span class="ico">⭐</span></div>
        <h3>Word Quiz</h3><p>Listen &amp; pick the right picture</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
      <button class="card c2" data-game="flashcard">
        <div class="ico-wrap"><span class="ico">🃏</span></div>
        <h3>Flashcards</h3><p>Flip, listen &amp; remember</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
      <button class="card c3" data-game="adventure">
        <div class="ico-wrap"><span class="ico">🗺️</span></div>
        <h3>Adventure</h3><p>Beat monsters, clear stages</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
      <button class="card c4" data-game="memory">
        <div class="ico-wrap"><span class="ico">🧠</span></div>
        <h3>Memory Match</h3><p>Find the matching pairs</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
      <button class="card c5" data-game="review">
        <div class="ico-wrap"><span class="ico">🔁</span></div>
        <h3>Review Words</h3><p>Practise your missed words</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
      <button class="card c6" data-game="spelling">
        <span class="badge-new">NEW</span>
        <div class="ico-wrap"><span class="ico">✏️</span></div>
        <h3>Spelling Quest</h3><p>Spell to defeat monsters</p>
        <span class="play-arr"><i class="ti ti-player-play" aria-hidden="true"></i></span>
      </button>
    </div>

    <!-- STREAK BANNER -->
    <div class="streak-bar" id="streakBanner">
      <div class="streak-text">
        <strong id="streakMsg">🔥 Start your streak!</strong>
        <span>Play every day to keep it going</span>
      </div>
      <div class="streak-days" id="streakDays"></div>
    </div>

  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen">
    <div class="bar">
      <button class="back" id="back" aria-label="Back to menu">← Menu</button>
      <div class="score" id="score" aria-live="polite">⭐ 0</div>
    </div>
    <div class="prog"><div id="progbar"></div></div>
    <div id="play"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dash">
    <div class="bar"><button class="back" id="dashBack">← Home</button><div class="score">📊 Progress</div></div>
    <div class="dgrid" id="dashStats"></div>
    <div class="section-t">🚀 My Learning Journey</div>
    <div id="dashJourney"></div>
    <div class="section-t">🏅 Badges</div>
    <div class="badges" id="dashBadges"></div>
    <div class="section-t">📚 Word Mastery (<span id="curLvLabel">K1</span>)</div>
    <div class="masterlist" id="dashMastery"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn warn" id="resetBtn">🗑️ Reset All Progress</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"><span class="te">🏅</span><span id="toastMsg"></span></div>
<script src="js/vocabulary.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/game.js"></script>
</body>
</html>
